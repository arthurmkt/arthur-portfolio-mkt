<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rolagem cinematográfica — modelo</title>
<!--
  MODELO: "site cinematográfico" (o objeto se mexe conforme a pessoa rola).
  Como funciona: um vídeo curto do objeto vira uma sequência de imagens
  (frames/0001.webp, 0002.webp...). Um <canvas> fica preso na tela e desenha
  a imagem que corresponde ao quanto a pessoa já rolou. Os textos entram e
  saem em faixas da rolagem (data-de / data-ate, de 0 a 1).

  O QUE MEXER:
  - QUADROS (no script): quantas imagens existem na pasta frames/
  - PASTA_CELULAR: versão menor dos frames para tela < 700px
  - --fundo: tem que ser A MESMA cor do fundo do vídeo, senão aparece a "caixa"
  - altura da .cena (500vh): quanto mais alto, mais lenta a animação
-->
<style>
  :root{
    --fundo:#efe7da;      /* = cor do fundo do vídeo gerado */
    --tinta:#2a1d14;
    --acento:#b5562f;
    --display:Georgia,"Times New Roman",serif;
    --corpo:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--corpo);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2{font-family:var(--display);font-weight:600;line-height:1.05;letter-spacing:-.02em;text-wrap:balance;margin:0}
  h1{font-size:clamp(40px,7vw,96px);max-width:12ch}
  h2{font-size:clamp(30px,4.6vw,60px);max-width:14ch}
  p{margin:0;max-width:40ch}

  /* a cena: alta para dar "tempo" de rolagem; o palco fica preso dentro dela */
  .cena{position:relative;height:500vh}
  .palco{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .js-pronto .poster{display:none}

  /* textos sobre a cena */
  .fala{position:absolute;left:clamp(20px,6vw,96px);top:50%;transform:translateY(-50%);display:grid;gap:18px;
        opacity:0;transition:opacity .5s ease,transform .8s cubic-bezier(.16,1,.3,1)}
  .fala.dir{left:auto;right:clamp(20px,6vw,96px);text-align:right;justify-items:end}
  .fala.ativa{opacity:1}
  .fala:not(.ativa){transform:translateY(calc(-50% + 24px))}
  .rotulo{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--acento)}
  .btn{display:inline-flex;align-items:center;height:52px;padding:0 26px;border-radius:999px;background:var(--acento);color:#fff;text-decoration:none;font-weight:700;width:max-content}
  .btn:focus-visible{outline:3px solid var(--acento);outline-offset:3px}

  /* carregando */
  .barra{position:fixed;left:0;top:0;height:2px;background:var(--acento);width:0;z-index:9;transition:width .2s,opacity .4s}

  .depois{min-height:80vh;display:grid;place-items:center;padding:80px 20px}

  @media (max-width:700px){
    .fala,.fala.dir{left:20px;right:20px;top:auto;bottom:12vh;transform:none;text-align:left;justify-items:start}
    .fala:not(.ativa){transform:translateY(16px)}
  }
  @media (prefers-reduced-motion:reduce){
    .cena{height:auto}.palco{position:relative}
    canvas{display:none}.js-pronto .poster{display:block}
    .fala{position:relative;opacity:1;transform:none;padding:24px 20px}
  }
</style>
</head>
<body>
<div class="barra" id="barra"></div>

<section class="cena" id="cena">
  <div class="palco">
    <!-- 1º frame como imagem: aparece na hora, sem JS e com menos movimento -->
    <img class="poster" src="frames/0001.webp" alt="[descrever o produto]">
    <canvas id="tela"></canvas>

    <div class="fala" data-de="0" data-ate=".22">
      <span class="rotulo">[marca · categoria]</span>
      <h1>[Título de 2 a 5 palavras]</h1>
      <p>[Uma linha com o porquê.]</p>
    </div>
    <div class="fala dir" data-de=".3" data-ate=".55">
      <span class="rotulo">[detalhe 1]</span>
      <h2>[O que esse momento do vídeo mostra]</h2>
    </div>
    <div class="fala" data-de=".62" data-ate=".85">
      <span class="rotulo">[detalhe 2]</span>
      <h2>[Segundo argumento]</h2>
    </div>
    <div class="fala dir" data-de=".9" data-ate="1.01">
      <h2>[Chamada final]</h2>
      <a class="btn" href="#contato">[Ação]</a>
    </div>
  </div>
</section>

<section class="depois" id="contato"><h2>[O resto da página segue normal]</h2></section>

<script>
(function(){
  var QUADROS = 150;                 // quantas imagens tem em frames/
  var PASTA = "frames/";             // desktop
  var PASTA_CELULAR = "frames-m/";   // versão menor (se não existir, use a mesma)
  var nome = function(i){ return ("000"+(i+1)).slice(-4)+".webp"; };

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var pasta = window.innerWidth < 700 ? PASTA_CELULAR : PASTA;
  var cena = document.getElementById("cena"), tela = document.getElementById("tela");
  var ctx = tela.getContext("2d"), barra = document.getElementById("barra");
  var falas = [].slice.call(document.querySelectorAll(".fala"));
  var imgs = new Array(QUADROS), prontas = 0, atual = -1;

  // carrega em duas passadas: 1 a cada 6 primeiro (a animação já funciona
  // "aos saltos"), depois preenche o resto. Assim não trava no 4G.
  var ordem = [];
  for (var i=0;i<QUADROS;i+=6) ordem.push(i);
  for (var j=0;j<QUADROS;j++) if (j%6) ordem.push(j);
  ordem.forEach(function(k){
    var im = new Image(); im.decoding = "async"; im.src = pasta + nome(k);
    im.onload = function(){ imgs[k] = im; prontas++; barra.style.width = (prontas/QUADROS*100)+"%";
      if (prontas === QUADROS) barra.style.opacity = 0;
      if (k === 0){ document.documentElement.classList.add("js-pronto"); desenhar(true); } };
  });

  function maisProxima(n){ for (var d=0; d<QUADROS; d++){ if (imgs[n-d]) return imgs[n-d]; if (imgs[n+d]) return imgs[n+d]; } }

  function ajustar(){
    var r = Math.min(window.devicePixelRatio||1, 2);
    tela.width = tela.clientWidth*r; tela.height = tela.clientHeight*r; desenhar(true);
  }

  function progresso(){
    var c = cena.getBoundingClientRect(), total = cena.offsetHeight - window.innerHeight;
    return Math.min(Math.max(-c.top/total,0),1);
  }

  function desenhar(forcar){
    var p = progresso(), n = Math.round(p*(QUADROS-1));
    falas.forEach(function(f){ f.classList.toggle("ativa", p>=+f.dataset.de && p<+f.dataset.ate); });
    if (n===atual && !forcar) return;
    var im = imgs[n] || maisProxima(n); if (!im) return; atual = n;
    // "cover": preenche a tela sem distorcer
    var W=tela.width, H=tela.height, s=Math.max(W/im.width, H/im.height), w=im.width*s, h=im.height*s;
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--fundo");
    ctx.fillRect(0,0,W,H); ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h);
  }

  var pedindo=false;
  window.addEventListener("scroll", function(){ if(pedindo) return; pedindo=true;
    requestAnimationFrame(function(){ desenhar(); pedindo=false; }); }, {passive:true});
  window.addEventListener("resize", ajustar);
  ajustar();
})();
</script>
</body>
</html>
